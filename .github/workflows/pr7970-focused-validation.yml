name: "PR 7970 focused validation"

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_HTTP_MULTIPLEXING: false
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  focused-tests:
    name: RPC cardinality and deduplication tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: ubuntu dependencies
        run: |
          sudo apt-get update
          sudo bash scripts/install_ubuntu_dependencies.sh
      - name: cache cargo files and outputs
        uses: Swatinem/rust-cache@v2
      - name: oversized requests reject before backend work
        run: cargo test --locked -p tari_core oversized_repeated_requests_are_rejected_before_backend_work -- --nocapture
      - name: duplicate lookups preserve response shape
        run: cargo test --locked -p tari_core transaction_batch_query_deduplicates_work_but_preserves_response_shape -- --nocapture
